<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Input</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center">
    <div id="capture" tabindex="0">
      <canvas id="screen"></canvas>
    </div>
  </div>
  <div id="file-progress" class="hidden">
    <div id="file-progress-bar"></div>
    <span id="file-progress-text">0%</span>
  </div>
  <div id="floating-controls">
    <button id="fc-toggle" aria-label="Menu">☰</button>
    <div id="fc-menu">
      <button id="fc-keyboard">Keyboard</button>
      <button id="fc-fullscreen">Fullscreen</button>
      <input type="range" min="10" max="80" value="70" id="fc-quality">
    </div>
  </div>
  <script src="translate.js"></script>
  <script src="warning.js"></script>
  <script src="keyboard.js"></script>
  <script src="script.js"></script>
  <script src="viewer.js"></script>
  <script src="audio.js"></script>
  <script src="file.js"></script>
  <script src="control.js"></script>
</body>
</html>
